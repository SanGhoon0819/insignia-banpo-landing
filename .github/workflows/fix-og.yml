name: Fix OG metadata

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-og:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace embedded OG image with public JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          url = 'https://sanghoon0819.github.io/insignia-banpo-landing/og-card.jpg?v=20260821'

          replacement = (
              f'<meta content="{url}" property="og:image"/>\n'
              '<meta content="1200" property="og:image:width"/>\n'
              '<meta content="630" property="og:image:height"/>\n'
              '<meta content="image/jpeg" property="og:image:type"/>\n'
              '<meta content="인시그니아 반포 | 반포 신축 59㎡·84㎡" property="og:image:alt"/>'
          )

          s, n = re.subn(r'<meta content="data:image/[^\"]+" property="og:image"/>', replacement, s, count=1)
          if n == 0 and 'property="og:image"' in s:
              s = re.sub(r'<meta content="[^\"]+" property="og:image"/>', replacement, s, count=1)

          if 'property="og:url"' not in s:
              s = s.replace(
                  '<meta content="website" property="og:type"/>',
                  '<meta content="website" property="og:type"/>\n<meta content="https://sanghoon0819.github.io/insignia-banpo-landing/" property="og:url"/>',
                  1,
              )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix social preview metadata"
          git push
