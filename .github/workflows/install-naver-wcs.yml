name: Install Naver WCS common script

on:
  push:
    paths:
      - '.github/workflows/install-naver-wcs.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Naver WCS common script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          marker = '<html lang="ko"><head>'
          code = '''<!-- NAVER WCS COMMON SCRIPT -->
          <script type="text/javascript" src="//wcs.naver.net/wcslog.js"></script>
          <script type="text/javascript">
          if (!wcs_add) var wcs_add={};
          wcs_add["wa"] = "s_23a205432101";
          if (!_nasa) var _nasa={};
          if(window.wcs){
          wcs.inflow();
          wcs_do();
          }
          </script>
          <!-- END NAVER WCS COMMON SCRIPT -->'''
          if '<!-- NAVER WCS COMMON SCRIPT -->' not in t:
              if marker not in t:
                  raise SystemExit('head marker not found')
              t = t.replace(marker, marker + '\n' + code, 1)
              p.write_text(t, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git diff -- index.html
          if git diff --quiet -- index.html; then echo "NO INDEX CHANGE"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Install Naver WCS common tracking script"
          git push
